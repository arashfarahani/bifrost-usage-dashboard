name: Build and publish
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (for retrying a failed build)
        type: string
        required: true
      commit:
        description: Full release commit SHA
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify published release and exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - id: image
        name: Normalize registry path
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: runner
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.arch }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - id: image
        name: Normalize registry path
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - name: Merge platform digests and verify manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(--tag "$tag"); fi
          done <<< "$TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${RELEASE_TAG#v}" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
