name: Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag || steps.existing.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: existing
        name: Detect an existing release tag or bootstrap version
        shell: bash
        run: |
          stable_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          existing=$(git tag --points-at HEAD --sort=-version:refname | grep -E "$stable_pattern" | head -n 1 || true)
          echo "tag=$existing" >> "$GITHUB_OUTPUT"
          stable=$(git tag --merged HEAD | grep -E "$stable_pattern" || true)
          if [ -z "$stable" ]; then
            echo 'initial_version=1.0.0' >> "$GITHUB_OUTPUT"
          fi
      - name: Bump version and push tag
        id: tag
        if: steps.existing.outputs.tag == ''
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ github.sha }}
          release_branches: main
          tag_prefix: v
          default_bump: patch
          custom_tag: ${{ steps.existing.outputs.initial_version }}
          create_local_tag: true
          ignore_keywords: ""
      - name: Publish release (safe to rerun)
        if: steps.tag.outputs.new_tag != '' || steps.existing.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.new_tag || steps.existing.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = false
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
  build:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      commit: ${{ github.sha }}
